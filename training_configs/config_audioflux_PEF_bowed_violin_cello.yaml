instrument_name: "bowed"
target_wav: "example_songs_for_training/violin_and_cello_duo_in_b_flat_major_andantino.wav"
output_dir: "trained_models/config_audioflux_bowed_violin_cello"
device: "cuda"
epochs: 100
learning_rate: 0.01

audio:
  start_time: 0.0
  duration: 10.0
  sample_rate: 44100

note_detection:
  method: "audioflux"
  audioflux_type: "PEF" # or 'YIN'
  audioflux_min_freq: 50.0
  audioflux_max_freq: 2000.0
  audioflux_slide_length: 1024

spectral_loss:
  fft_sizes: [2048, 1024, 512]
  high_freq_emphasis: 2.0
