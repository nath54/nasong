instrument_name: "piano"
target_wav: "example_songs_for_training/piano_Für_Elise.wav"
output_dir: "trained_models/basic_pitch_piano_fur_elise"
device: "cuda"
epochs: 200
learning_rate: 0.01

audio:
  start_time: 0.0
  duration: 10.0
  sample_rate: 44100

note_detection:
  method: "basic_pitch_onnx"
  # Requires nmp.onnx in models/ directory or specified path
  onnx_path: "models/nmp.onnx"
  bp_onset_threshold: 0.5
  bp_frame_threshold: 0.3
  bp_min_note_len: 58.0
  bp_min_freq: 50.0
  bp_max_freq: 2000.0

spectral_loss:
  fft_sizes: [2048, 1024, 512]
  high_freq_emphasis: 2.0
