[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nasong"
version = "0.1.0"
description = "A powerful audio generation library and application."
authors = [
  { name="Nathan Cerisara", email="nathan.cerisara@protonmail.com" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "PyYAML",
    "tabulate", # For markdown table
    "textual[syntax]",
]

[project.scripts]
nasong = "nasong.scripts.main:main"
nasong-vis = "nasong.scripts.vis_tool:main"
nasong-train = "nasong.scripts.train_cli:main"
nasong-evaluate = "nasong.scripts.evaluate:main"
nasong-leaderboard = "nasong.scripts.leaderboard:main"
nasong-monitor = "nasong.scripts.monitor_cli:main"
nasong-rave = "nasong.app.main_tui:main"
nasong-rave-dev = "nasong.app.main_headless:main"
nasong-daw = "nasong.app.main_daw:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["tests"]

[tool.mypy]
exclude = ["tests"]

[tool.pylint.master]
ignore = ["tests"]
